[profile.default]
src = 'contracts'
out = 'out'
libs = ['lib']
test = 'test'
via_ir = true
solc_version = '0.8.17'
evm_version = 'paris'
optimizer = true
optimizer_runs = 1_000_000
bytecode_hash = 'none'
cbor_metadata = false
fs_permissions = [
    { access = "read", path = "./script/deployParameters/" },
    { access = "read-write", path = "./deployment-addresses/" },
]

[profile.default.optimizer_details]
constantOptimizer = true
yul = true

[profile.lite]
via_ir = false
optimizer_runs = 200

[fmt]
line_length = 120
quote_style = 'single'

[fuzz]
runs = 1000

[rpc_endpoints]
bsc = "${BSC_MAINNET_RPC}"
bsc_testnet = "${BSC_TESTNET_RPC}"

# BscScan's standalone V1 API is retired; verification goes through the unified Etherscan V2
# endpoint, where one key covers every supported chain
[etherscan]
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56 }
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 97 }
