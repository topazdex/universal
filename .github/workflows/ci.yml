name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_DISABLE_NIGHTLY_WARNING: '1'
  BSC_MAINNET_RPC: ${{ secrets.BSC_MAINNET_RPC }}
  ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
  FORK_BLOCK: '116350000'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        working-directory: packages/universal-router
        run: forge build
      - name: Format check
        working-directory: packages/universal-router
        run: forge fmt --check
      - name: Fork tests
        working-directory: packages/universal-router
        # every test forks BNB Chain, so without an RPC there is nothing meaningful to run
        if: env.BSC_MAINNET_RPC != ''
        run: forge test -vv

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Enable corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Build the router artifact the end to end tests deploy
        working-directory: packages/universal-router
        run: forge build
      - name: Build
        run: yarn build
      - name: Typecheck
        run: yarn lint
      # The TypeScript suites boot an anvil fork and deploy onto it; they self-skip without an RPC,
      # so this job is green on a pull request from a fork, which cannot see repository secrets.
      #
      # The Solidity suite is excluded here on purpose. Root `yarn test` includes it, but forge has
      # no equivalent self-skip — `vm.createSelectFork` fails outright with `invalid rpc url` — so
      # running it here turns every secret-less run red. The contracts job above owns it and guards
      # it properly.
      #
      # The root workspace is excluded as well: `--all` would include it, and its own `test` script
      # is an unfiltered `foreach --all`, which would recurse straight back into the Solidity suite.
      - name: Test
        run: yarn workspaces foreach --all --exclude topazdex-universal --exclude @topazdex/universal-router run test
