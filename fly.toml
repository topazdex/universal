# fly.toml app configuration file generated for topaz-routing-api on 2026-08-16T18:19:21-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
# Deploy notes and the reasoning behind these values: docs/ROUTING_API_DEPLOYMENT.md
#
#   fly deploy                        # run from the repo root
#
# Enabled chains are in config/chains.production.json. This configuration uses public RPCs;
# see docs/MULTICHAIN.md for per-chain configuration and private RPC endpoints.

app = 'topaz-routing-api'
# a quote is ~100 round trips to the RPC and one to the client, so this wants to sit near the RPC
# provider rather than near users
primary_region = 'ord'

[build]
  dockerfile = 'packages/routing-api/Dockerfile'

[env]
  CHAINS_CONFIG_FILE = '/app/config/chains.production.json'
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 12
    soft_limit = 6

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
