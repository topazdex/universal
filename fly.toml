# fly.toml app configuration file generated for topaz-routing-api on 2026-08-16T18:19:21-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
# Deploy notes and the reasoning behind these values: docs/ROUTING_API_DEPLOYMENT.md
#
#   fly secrets set BSC_MAINNET_RPC="https://…"                     # one endpoint
#   fly secrets set BSC_RPC_URLS="https://paid…,https://public…"     # or several, with failover
#   fly deploy                                                      # run from the repo root
#
# With neither secret set the service falls back to public endpoints and still works, several
# times slower.

app = 'topaz-routing-api'
# a quote is ~100 round trips to the RPC and one to the client, so this wants to sit near the RPC
# provider rather than near users
primary_region = 'ord'

[build]
  dockerfile = 'packages/routing-api/Dockerfile'

[env]
  CHAIN_ID = '56'
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 30
    soft_limit = 15

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
